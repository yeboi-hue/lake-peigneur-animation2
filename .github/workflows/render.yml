name: Render Lake Peigneur Short (Parallel, Quality Preserved)

on:
  workflow_dispatch:
    inputs:
      chunks:
        description: "Number of parallel frame chunks"
        type: choice
        options:
          - "12"
          - "16"
          - "20"
        required: true
        default: "12"
  push:
    branches: [main]
    paths:
      - "**"
      - "!README.md"

permissions:
  contents: read
  actions: read

env:
  PROJECT_ZIP_COMPLETE: LakePeigneur-Short-COMPLETE.zip
  PROJECT_ZIP_SHORT: LakePeigneur-Short.zip
  PROJECT_ZIP_OPTIMIZED: LakePeigneur-Short-PARALLEL-OPTIMIZED.zip
  RENDER_CONCURRENCY: "2"
  FRAME_RATE: "30"

jobs:
  prepare:
    name: Prepare audio and frame timing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      total_frames: ${{ steps.timing.outputs.total_frames }}
      chunk_count: ${{ steps.matrix.outputs.chunk_count }}
      chunk_matrix: ${{ steps.matrix.outputs.chunk_matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate or extract project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            PROJECT_DIR="."
          elif [ -f "$PROJECT_ZIP_COMPLETE" ]; then
            PROJECT_DIR=".render-work/project"
            mkdir -p "$PROJECT_DIR"
            unzip -q "$PROJECT_ZIP_COMPLETE" -d "$PROJECT_DIR"
          elif [ -f "$PROJECT_ZIP_SHORT" ]; then
            PROJECT_DIR=".render-work/project"
            mkdir -p "$PROJECT_DIR"
            unzip -q "$PROJECT_ZIP_SHORT" -d "$PROJECT_DIR"
          elif [ -f "$PROJECT_ZIP_OPTIMIZED" ]; then
            PROJECT_DIR=".render-work/project"
            mkdir -p "$PROJECT_DIR"
            unzip -q "$PROJECT_ZIP_OPTIMIZED" -d "$PROJECT_DIR"
          else
            echo "No project found."
            exit 1
          fi

          test -f "$PROJECT_DIR/package.json"
          test -f "$PROJECT_DIR/scripts/make_audio.py"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ steps.project.outputs.project_dir }}/requirements.txt

      - name: Install audio-generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          pip install -r "$PROJECT_DIR/requirements.txt"

      - name: Generate narration, score, effects and timing
        run: |
          cd "$PROJECT_DIR"
          python scripts/make_audio.py
          test -s public/narration.wav
          test -s public/timing.json

      - name: Read exact frame count
        id: timing
        run: |
          TOTAL_FRAMES="$(python -c 'import json; print(int(json.load(open("'"$PROJECT_DIR"'/public/timing.json"))["total"]))')"

          if [ "$TOTAL_FRAMES" -le 0 ]; then
            echo "Invalid frame count: $TOTAL_FRAMES"
            exit 1
          fi

          echo "total_frames=$TOTAL_FRAMES" >> "$GITHUB_OUTPUT"
          echo "Prepared $TOTAL_FRAMES frames at 30 FPS."

      - name: Create chunk matrix
        id: matrix
        env:
          REQUESTED_CHUNKS: ${{ github.event.inputs.chunks || '12' }}
        run: |
          case "$REQUESTED_CHUNKS" in
            12|16|20) ;;
            *) echo "Chunk count must be 12, 16, or 20."; exit 1 ;;
          esac

          MATRIX="$(python -c 'import json, os; print(json.dumps(list(range(int(os.environ["REQUESTED_CHUNKS"])))) )')"

          echo "chunk_count=$REQUESTED_CHUNKS" >> "$GITHUB_OUTPUT"
          echo "chunk_matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Upload generated audio and timing
        uses: actions/upload-artifact@v4
        with:
          name: prepared-media
          path: |
            ${{ steps.project.outputs.project_dir }}/public/narration.wav
            ${{ steps.project.outputs.project_dir }}/public/timing.json
          if-no-files-found: error
          retention-days: 1

  render-chunks:
    name: Render chunk ${{ matrix.chunk }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.chunk_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate or extract project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package.json ]; then
            PROJECT_DIR="."
          elif [ -f "$PROJECT_ZIP_COMPLETE" ]; then
            PROJECT_DIR=".render-work/project"
            mkdir -p "$PROJECT_DIR"
            unzip -q "$PROJECT_ZIP_COMPLETE" -d "$PROJECT_DIR"
          elif [ -f "$PROJECT_ZIP_SHORT" ]; then
            PROJECT_DIR=".render-work/project"
            mkdir -p "$PROJECT_DIR"
            unzip -q "$PROJECT_ZIP_SHORT" -d "$PROJECT_DIR"
          elif [ -f "$PROJECT_ZIP_OPTIMIZED" ]; then
            PROJECT_DIR=".render-work/project"
            mkdir -p "$PROJECT_DIR"
            unzip -q "$PROJECT_ZIP_OPTIMIZED" -d "$PROJECT_DIR"
          else
            echo "Project files or project ZIP not found."
            exit 1
          fi

          test -f "$PROJECT_DIR/package.json"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}-v1
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Remotion browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: ${{ runner.os }}-remotion-browser-v1
          restore-keys: |
            ${{ runner.os }}-remotion-browser-

      - name: Install browser system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2 libgbm1

      - name: Install JavaScript dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install --no-audit --no-fund

      - name: Download generated audio and timing
        uses: actions/download-artifact@v4
        with:
          name: prepared-media
          path: prepared-media

      - name: Place generated audio and timing in project
        run: |
          mkdir -p "$PROJECT_DIR/public"
          cp prepared-media/narration.wav "$PROJECT_DIR/public/narration.wav"
          cp prepared-media/timing.json "$PROJECT_DIR/public/timing.json"

      - name: Install Remotion browser
        run: cd "$PROJECT_DIR" && npx remotion browser ensure

      - name: Calculate exact frame range and render silently
        env:
          TOTAL_FRAMES: ${{ needs.prepare.outputs.total_frames }}
          CHUNK_COUNT: ${{ needs.prepare.outputs.chunk_count }}
          CHUNK_INDEX: ${{ matrix.chunk }}
        shell: bash
        run: |
          set -euo pipefail

          START_FRAME=$(( CHUNK_INDEX * TOTAL_FRAMES / CHUNK_COUNT ))
          END_FRAME=$(( (CHUNK_INDEX + 1) * TOTAL_FRAMES / CHUNK_COUNT - 1 ))

          if [ "$START_FRAME" -gt "$END_FRAME" ]; then
            echo "Invalid empty chunk: $CHUNK_INDEX"
            exit 1
          fi

          printf -v CHUNK_NAME "chunk-%02d.mp4" "$CHUNK_INDEX"
          mkdir -p "$PROJECT_DIR/out/chunks"

          echo "Rendering chunk $CHUNK_INDEX: frames $START_FRAME-$END_FRAME"

          cd "$PROJECT_DIR"

          npx remotion render src/index.ts LakePeigneurShort "out/chunks/$CHUNK_NAME" \
            --frames="$START_FRAME-$END_FRAME" \
            --muted \
            --codec h264 \
            --crf 16 \
            --gl=swangle \
            --concurrency=2 \
            --timeout=360000 \
            --scale=1.3333

      - name: Stage rendered chunk for artifact upload
        run: |
          mkdir -p chunk-output
          cp "$PROJECT_DIR/out/chunks/chunk-$(printf '%02d' '${{ matrix.chunk }}').mp4" chunk-output/

      - name: Upload rendered chunk
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk }}
          path: chunk-output/chunk-*.mp4
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble final video and attach audio once
    needs: [prepare, render-chunks]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate or extract project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package.json ]; then
            PROJECT_DIR="."
          elif [ -f "$PROJECT_ZIP_COMPLETE" ]; then
            PROJECT_DIR=".render-work/project"
            mkdir -p "$PROJECT_DIR"
            unzip -q "$PROJECT_ZIP_COMPLETE" -d "$PROJECT_DIR"
          elif [ -f "$PROJECT_ZIP_SHORT" ]; then
            PROJECT_DIR=".render-work/project"
            mkdir -p "$PROJECT_DIR"
            unzip -q "$PROJECT_ZIP_SHORT" -d "$PROJECT_DIR"
          elif [ -f "$PROJECT_ZIP_OPTIMIZED" ]; then
            PROJECT_DIR=".render-work/project"
            mkdir -p "$PROJECT_DIR"
            unzip -q "$PROJECT_ZIP_OPTIMIZED" -d "$PROJECT_DIR"
          else
            echo "Project files or project ZIP not found."
            exit 1
          fi

          test -f "$PROJECT_DIR/package.json"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Download generated audio and timing
        uses: actions/download-artifact@v4
        with:
          name: prepared-media
          path: prepared-media

      - name: Place generated audio and timing in project
        run: |
          mkdir -p "$PROJECT_DIR/public"
          cp prepared-media/narration.wav "$PROJECT_DIR/public/narration.wav"
          cp prepared-media/timing.json "$PROJECT_DIR/public/timing.json"

      - name: Download all rendered chunks
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Concatenate chunks and attach the complete audio once
        env:
          TOTAL_FRAMES: ${{ needs.prepare.outputs.total_frames }}
          FRAME_RATE: "30"
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_DIR/out"
          : > "$PROJECT_DIR/out/chunks.txt"

          EXPECTED_CHUNKS="${{ needs.prepare.outputs.chunk_count }}"
          FOUND_CHUNKS=0

          for FILE in chunks/chunk-*.mp4; do
            [ -f "$FILE" ] || continue
            printf "file '%s/%s'\n" "$PWD" "$FILE" >> "$PROJECT_DIR/out/chunks.txt"
            FOUND_CHUNKS=$((FOUND_CHUNKS + 1))
          done

          if [ "$FOUND_CHUNKS" -ne "$EXPECTED_CHUNKS" ]; then
            echo "Expected $EXPECTED_CHUNKS chunks but found $FOUND_CHUNKS."
            exit 1
          fi

          ffmpeg -y -v error -f concat -safe 0 -i "$PROJECT_DIR/out/chunks.txt" \
            -map 0:v:0 -c:v copy -an "$PROJECT_DIR/out/video-only.mp4"

          DURATION="$(python -c 'import os; print(int(os.environ["TOTAL_FRAMES"]) / int(os.environ["FRAME_RATE"]))')"

          ffmpeg -y -v error -i "$PROJECT_DIR/out/video-only.mp4" \
            -i "$PROJECT_DIR/public/narration.wav" \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 320k -ar 48000 \
            -af apad -t "$DURATION" -movflags +faststart \
            "$PROJECT_DIR/out/lake-peigneur.mp4"

      - name: Verify final frame count, dimensions, frame rate and audio
        env:
          EXPECTED_FRAMES: ${{ needs.prepare.outputs.total_frames }}
        shell: bash
        run: |
          set -euo pipefail

          VIDEO="$PROJECT_DIR/out/lake-peigneur.mp4"

          # Extract only the frame-count value.
          # Avoid CSV output because FFprobe may append a trailing comma.
          ACTUAL_FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=nb_read_frames \
            -of default=noprint_wrappers=1:nokey=1 "$VIDEO" | tr -d '[:space:],')"

          # Validate that the result contains only digits.
          if ! [[ "$ACTUAL_FRAMES" =~ ^[0-9]+$ ]]; then
            echo "Invalid FFprobe frame-count output: '$ACTUAL_FRAMES'"
            exit 1
          fi

          if [ "$ACTUAL_FRAMES" != "$EXPECTED_FRAMES" ]; then
            echo "Frame-count mismatch: expected $EXPECTED_FRAMES, got $ACTUAL_FRAMES."
            exit 1
          fi

          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate,duration \
            -of default=nw=1 "$VIDEO"

          AUDIO_STREAMS="$(ffprobe -v error -select_streams a -show_entries stream=index \
            -of csv=p=0 "$VIDEO" | wc -l)"

          if [ "$AUDIO_STREAMS" -ne 1 ]; then
            echo "Expected exactly one audio stream, found $AUDIO_STREAMS."
            exit 1
          fi

          echo "Verified $ACTUAL_FRAMES frames and exactly one audio stream."

          mkdir -p final-output
          cp "$VIDEO" final-output/lake-peigneur.mp4

      - name: Upload final MP4
        uses: actions/upload-artifact@v4
        with:
          name: lake-peigneur-mp4
          path: final-output/lake-peigneur.mp4
          retention-days: 30
